site_name: K Global Operations Manual
site_description: >-
  The K Global Knowledge Center — the operations manual for K Global, a
  fictional virtual airline for flight-simulation use on VATSIM. Not real-world
  aviation or advisory information.
site_author: K Global
# Custom domain (see docs/CNAME). Keep in sync with the Pages custom domain.
site_url: https://ops.kglobalair.com/

# Fail the build on broken internal links / nav — enforced in CI too.
strict: true

# Internal notes / drafts that ship in the repo but are not manual pages.
exclude_docs: |
  assets/README.md

theme:
  name: material
  custom_dir: overrides
  language: en
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  icon:
    repo: fontawesome/brands/github
  font:
    text: Inter
    code: B612 Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - navigation.instant
    - navigation.instant.progress
    - navigation.footer
    # Fold each page's headings into the left nav under the active page, so the
    # sidebar is one rail of folder pages + in-page links (no separate TOC).
    - toc.integrate
    - toc.follow
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.copy

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.keys
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search
  - glightbox
  # Members-only gate — every page is AES-encrypted at build time; readers
  # enter the shared password to decrypt in-browser. The password comes from
  # the OPS_PASSWORD environment variable (a GitHub Actions secret in CI), so
  # it is never committed. The local fallback is a non-secret placeholder.
  - encryptcontent:
      global_password: !ENV [OPS_PASSWORD, "CHANGE-ME-LOCAL-ONLY"]
      # No per-page title prefix — the site name already says K Global, so a
      # prefix would repeat it on every nav item.
      title_prefix: ""
      summary: "K Global Operations Manual"
      encryption_info_message: >-
        Members only. This is the operations manual for K Global, a fictional
        virtual airline for flight-simulation use on VATSIM — not real-world
        aviation guidance. Enter the members password to continue.
      placeholder: "Members password"
      decryption_failure_message: "Incorrect password — please try again."
      password_button: True
      password_button_text: "Enter"
      remember_password: True
      # Silence the plugin's password-entropy warning so it can't fail the
      # `--strict` build for a user-chosen secret. Pick a strong password
      # (see HANDOFF.md) — that's the real mitigation, not this threshold.
      threshold_warning_min_entropy: 0

