name: Deploy Operations Manual to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least-privilege token: only what the Pages deploy needs.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Fail safe: refuse to publish an UNencrypted manual if the members
      # password secret is missing (otherwise the whole site would be public).
      - name: Require members password secret
        env:
          OPS_PASSWORD: ${{ secrets.OPS_PASSWORD }}
        run: |
          if [ -z "$OPS_PASSWORD" ]; then
            echo "::error::OPS_PASSWORD secret is not set. Add it in Settings → Secrets and variables → Actions. Refusing to build an unencrypted manual."
            exit 1
          fi

      - name: Build manual (strict, encrypted)
        env:
          OPS_PASSWORD: ${{ secrets.OPS_PASSWORD }}
        run: mkdocs build --strict

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
